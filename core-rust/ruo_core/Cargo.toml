[package]
name = "ruo_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ruo_core"

[dependencies]
# Serialization and errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Networking and async
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"

# Database (SQLCipher / SQLite)
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = { version = "0.4", features = ["serde"] }

# UniFFI for cross-language binding
uniffi = { version = "0.32.2", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.10"
warp = "0.3"
async-stream = "0.3"
