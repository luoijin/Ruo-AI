name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install libsqlite3 and sqlcipher dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev sqlcipher libsqlcipher-dev libssl-dev pkg-config
      - name: Cargo fmt check
        working-directory: core-rust
        run: cargo fmt --all -- --check
      - name: Cargo clippy check
        working-directory: core-rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo test
        working-directory: core-rust
        run: cargo test --all

  backend-tests:
    name: Backend Tests (ai-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruo_user
          POSTGRES_PASSWORD: ruo_password
          POSTGRES_DB: ruo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e .
      - name: Ruff check
        working-directory: ai-service
        run: ruff check .
      - name: Ruff format check
        working-directory: ai-service
        run: ruff format --check .
      - name: Run Alembic migrations
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ruo_user:ruo_password@localhost:5432/ruo_db
          SYNC_DATABASE_URL: postgresql://ruo_user:ruo_password@localhost:5432/ruo_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-tests
          GOOGLE_CLIENT_ID: test-google-client-id-for-testing
        run: alembic upgrade head
      - name: Run Pytest
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ruo_user:ruo_password@localhost:5432/ruo_db
          SYNC_DATABASE_URL: postgresql://ruo_user:ruo_password@localhost:5432/ruo_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-tests
          GOOGLE_CLIENT_ID: test-google-client-id-for-testing
          ENVIRONMENT: test
        run: pytest -v
