name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Core Tests (SQLCipher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo fmt check
        working-directory: core-rust
        run: cargo fmt --all -- --check
      - name: Cargo clippy check
        working-directory: core-rust
        run: cargo clippy --all-targets --no-default-features --features sqlcipher -- -D warnings
      - name: SQLCipher tests
        working-directory: core-rust
        run: cargo test --all --no-default-features --features sqlcipher

  rust-logic-tests:
    name: Rust Logic Tests (Plain SQLite, Host Debug Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Plain SQLite logic tests
        working-directory: core-rust
        run: cargo test --all --no-default-features --features plain-sqlite-tests

  android-build:
    name: Android Rust, UniFFI, and APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;30.0.16248370 platforms;android-36"
      - name: Export NDK paths for cargo-ndk and OpenSSL
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "CARGO_NDK_PLATFORM=26" >> "$GITHUB_ENV"
          cat "$ANDROID_SDK_ROOT/ndk/30.0.16248370/source.properties"
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build debug SQLCipher Rust library for arm64-v8a
        working-directory: core-rust
        run: cargo ndk -t arm64-v8a -o ../android/core/rustbridge/src/main/jniLibs build --locked --no-default-features --features sqlcipher
      - name: Generate Kotlin bindings from the Android library
        working-directory: core-rust
        run: >-
          cargo run --locked --no-default-features --features bindgen-cli,sqlcipher --bin uniffi-bindgen --
          generate ../android/core/rustbridge/src/main/jniLibs/arm64-v8a/libruo_core.so
          --language kotlin
          --no-format
          --out-dir ../android/core/rustbridge/build/generated/uniffi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build app and instrumented test APKs
        run: gradle -p android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Stage debug SQLCipher bridge artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/ruo-ai-gate2/android/core/rustbridge/src/main/jniLibs/arm64-v8a"
          mkdir -p "$RUNNER_TEMP/ruo-ai-gate2/apk"
          cp android/core/rustbridge/src/main/jniLibs/arm64-v8a/libruo_core.so \
            "$RUNNER_TEMP/ruo-ai-gate2/android/core/rustbridge/src/main/jniLibs/arm64-v8a/"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ruo-ai-gate2/apk/"
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "$RUNNER_TEMP/ruo-ai-gate2/apk/"
      - name: Upload SQLCipher library and device test APKs
        uses: actions/upload-artifact@v4
        with:
          name: gate2-sqlcipher-arm64
          path: ${{ runner.temp }}/ruo-ai-gate2/
          if-no-files-found: error

  backend-tests:
    name: Backend Tests (ai-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruo_user
          POSTGRES_PASSWORD: ruo_password
          POSTGRES_DB: ruo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e .
      - name: Ruff check
        working-directory: ai-service
        run: ruff check .
      - name: Ruff format check
        working-directory: ai-service
        run: ruff format --check .
      - name: Run Alembic migrations
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ruo_user:ruo_password@localhost:5432/ruo_db
          SYNC_DATABASE_URL: postgresql://ruo_user:ruo_password@localhost:5432/ruo_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-tests
          GOOGLE_CLIENT_ID: test-google-client-id-for-testing
        run: alembic upgrade head
      - name: Run Pytest
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ruo_user:ruo_password@localhost:5432/ruo_db
          SYNC_DATABASE_URL: postgresql://ruo_user:ruo_password@localhost:5432/ruo_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-tests
          GOOGLE_CLIENT_ID: test-google-client-id-for-testing
          ENVIRONMENT: test
        run: pytest -v
