name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Core Tests (SQLCipher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo fmt check
        working-directory: core-rust
        run: cargo fmt --all -- --check
      - name: Cargo clippy check
        working-directory: core-rust
        run: cargo clippy --all-targets --no-default-features --features sqlcipher -- -D warnings
      - name: SQLCipher tests
        working-directory: core-rust
        run: cargo test --all --no-default-features --features sqlcipher
      - name: Release transport policy test
        working-directory: core-rust
        run: cargo test --release --no-default-features --features sqlcipher release_build_rejects_cleartext_even_when_override_is_true

  rust-logic-tests:
    name: Rust Logic Tests (Plain SQLite, Host Debug Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Plain SQLite logic tests
        working-directory: core-rust
        run: cargo test --all --no-default-features --features plain-sqlite-tests

  android-build:
    name: Android Rust, UniFFI, and APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;30.0.16248370 platforms;android-37"
      - name: Export NDK paths for cargo-ndk and OpenSSL
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "CARGO_NDK_PLATFORM=26" >> "$GITHUB_ENV"
          cat "$ANDROID_SDK_ROOT/ndk/30.0.16248370/source.properties"
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build debug SQLCipher Rust library for arm64-v8a
        working-directory: core-rust
        run: cargo ndk -t arm64-v8a -o ../android/core/rustbridge/src/main/jniLibs build --locked --no-default-features --features sqlcipher
      - name: Generate Kotlin bindings from the Android library
        working-directory: core-rust
        run: >-
          cargo run --locked --no-default-features --features bindgen-cli,sqlcipher --bin uniffi-bindgen --
          generate ../android/core/rustbridge/src/main/jniLibs/arm64-v8a/libruo_core.so
          --language kotlin
          --no-format
          --out-dir ../android/core/rustbridge/build/generated/uniffi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build app shell and debug APKs
        id: android_apks
        env:
          RUO_DEBUG_KEYSTORE_BASE64: ${{ secrets.RUO_DEBUG_KEYSTORE_BASE64 }}
          RUO_DEBUG_STORE_PASSWORD: ${{ secrets.RUO_DEBUG_STORE_PASSWORD }}
          RUO_DEBUG_KEY_ALIAS: ${{ secrets.RUO_DEBUG_KEY_ALIAS }}
          RUO_DEBUG_KEY_PASSWORD: ${{ secrets.RUO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore_path="$RUNNER_TEMP/ruo-debug-ci.keystore"
          certificate_path="$RUNNER_TEMP/ruo-debug-ci-certificate.pem"
          cleanup() {
            rm -f "$keystore_path" "$certificate_path"
          }
          trap cleanup EXIT

          stable_signing=true
          if [[ -z "${RUO_DEBUG_KEYSTORE_BASE64:-}" ||
                -z "${RUO_DEBUG_STORE_PASSWORD:-}" ||
                -z "${RUO_DEBUG_KEY_ALIAS:-}" ||
                -z "${RUO_DEBUG_KEY_PASSWORD:-}" ]]; then
            stable_signing=false
            echo "::warning::Stable debug signing secrets are unavailable; APKs will not be uploaded."
            echo "stable_signing=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$RUO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            chmod 600 "$keystore_path"
            export RUO_DEBUG_KEYSTORE_PATH="$keystore_path"
            echo "stable_signing=true" >> "$GITHUB_OUTPUT"
          fi

          gradle -p android --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

          if [[ "$stable_signing" == "true" ]]; then
            apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
            apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$apksigner"
            openssl pkcs12 -in "$keystore_path" -passin env:RUO_DEBUG_STORE_PASSWORD \
              -clcerts -nokeys -out "$certificate_path"

            expected_sha1="$(openssl x509 -in "$certificate_path" -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            actual_sha1="$("$apksigner" verify --print-certs "$apk_path" | awk '/Signer #1 certificate SHA-1 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected_sha256="$(openssl x509 -in "$certificate_path" -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            actual_sha256="$("$apksigner" verify --print-certs "$apk_path" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

            if [[ -z "$actual_sha1" || "$actual_sha1" != "$expected_sha1" ||
                  -z "$actual_sha256" || "$actual_sha256" != "$expected_sha256" ]]; then
              echo "::error::Debug APK signer does not match the configured keystore certificate."
              exit 1
            fi
            echo "Verified stable debug APK signer SHA-1: $actual_sha1"
            echo "Verified stable debug APK signer SHA-256: $actual_sha256"
          fi
      - name: Stage debug SQLCipher bridge artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/ruo-ai-gate2/android/core/rustbridge/src/main/jniLibs/arm64-v8a"
          cp android/core/rustbridge/src/main/jniLibs/arm64-v8a/libruo_core.so \
            "$RUNNER_TEMP/ruo-ai-gate2/android/core/rustbridge/src/main/jniLibs/arm64-v8a/"
      - name: Upload SQLCipher library
        uses: actions/upload-artifact@v4
        with:
          name: gate2-sqlcipher-arm64
          path: ${{ runner.temp }}/ruo-ai-gate2/
          if-no-files-found: error
      - name: Upload stable debug and instrumentation APKs
        if: steps.android_apks.outputs.stable_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate3b-instrumentation-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  backend-tests:
    name: Backend Tests (ai-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruo_user
          POSTGRES_PASSWORD: ruo_password
          POSTGRES_DB: ruo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e .
      - name: Ruff check
        working-directory: ai-service
        run: ruff check .
      - name: Ruff format check
        working-directory: ai-service
        run: ruff format --check .
      - name: Run Alembic migrations
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ruo_user:ruo_password@localhost:5432/ruo_db
          SYNC_DATABASE_URL: postgresql://ruo_user:ruo_password@localhost:5432/ruo_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-tests
          GOOGLE_CLIENT_ID: test-google-client-id-for-testing
        run: alembic upgrade head
      - name: Run Pytest
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ruo_user:ruo_password@localhost:5432/ruo_db
          SYNC_DATABASE_URL: postgresql://ruo_user:ruo_password@localhost:5432/ruo_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-tests
          GOOGLE_CLIENT_ID: test-google-client-id-for-testing
          ENVIRONMENT: test
        run: pytest -v
