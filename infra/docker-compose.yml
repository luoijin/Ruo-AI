services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ruo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruo_password}
      POSTGRES_DB: ${POSTGRES_DB:-ruo_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruo_user} -d ${POSTGRES_DB:-ruo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: ruo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ruo_user}:${POSTGRES_PASSWORD:-ruo_password}@db:5432/${POSTGRES_DB:-ruo_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-ruo_user}:${POSTGRES_PASSWORD:-ruo_password}@db:5432/${POSTGRES_DB:-ruo_db}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8000:8000"

volumes:
  pgdata:
