services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ruo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruo_password}
      POSTGRES_DB: ${POSTGRES_DB:-ruo_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruo_user} -d ${POSTGRES_DB:-ruo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: ruo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  pgdata:
